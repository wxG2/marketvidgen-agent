name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Check code file length
        run: ../scripts/check-code-file-lines.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests
        env:
          TESTING: "true"
          QWEN_API_KEY: "mock"
          ARK_API_KEY: "mock"
          USE_MOCK_ANALYZER: "true"
          USE_MOCK_LLM: "true"
          USE_MOCK_GENERATOR: "true"
          USE_MOCK_COMPOSITOR: "true"
          USE_MOCK_LIPSYNC: "true"
          USE_MOCK_TTS: "true"
          USE_MOCK_VIDEO_EDITOR: "true"
          MEM0_ENABLED: "false"
          AGENT_MEMORY_ENABLED: "false"
          LOG_FORMAT: "text"
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Check coverage report
        if: always()
        id: coverage
        run: |
          if [ -f coverage.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always() && steps.coverage.outputs.exists == 'true'
        with:
          fail_ci_if_error: false
          files: backend/coverage.xml
          flags: backend

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Check code file length
        run: ../scripts/check-code-file-lines.sh

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t vidgen-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t vidgen-frontend:${{ github.sha }} ./frontend
