[project]
name = "vidgen-backend"
version = "0.1.0"
description = "FastAPI backend for the VidGen short-video production workspace."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "Pillow==10.4.0",
    "aiofiles==24.1.0",
    "sse-starlette==2.1.3",
    "langgraph==0.6.11",
    "langchain-core==0.3.76",
    "langchain-openai==0.3.33",
    "typing-extensions==4.15.0",
    "alembic==1.13.2",
    "mem0ai==2.0.0",
    "structlog==25.5.0",
    "mcp==1.12.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
